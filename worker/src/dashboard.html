<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ATC</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
<style>
  :root {
    --night: #0f1530;
    --panel: #161f42;
    --edge: #2d3b6e;
    --text: #eef2ff;
    --dim: #8f9dcc;
    --orange: #f38020;
    --amber: #faae40;
    --red: #ff5757;
    --green: #62e07c;
    --cyan: #78d7ff;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--night); color: var(--text); }
  body { font: 20px/1.15 "VT323", ui-monospace, monospace; }
  header { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 18px; padding: 14px 20px; border-bottom: 4px solid var(--edge); }
  h1 { margin: 0; font: 22px/1 "Press Start 2P", monospace; color: var(--orange); }
  .sub { color: var(--amber); font: 10px/1 "Press Start 2P", monospace; }
  .baseline { color: var(--dim); }
  .baseline b { color: var(--text); font-weight: normal; }
  .live { margin-left: auto; color: var(--green); }
  .live.stale { color: var(--red); }

  main { display: grid; grid-template-columns: minmax(0, 1fr) 420px; gap: 20px; padding: 20px; max-width: 1700px; margin: 0 auto; }
  .scope { border: 4px solid var(--edge); box-shadow: 0 0 0 4px var(--night), 0 0 0 8px var(--edge); background: #4f8fe0; align-self: start; }
  canvas { display: block; width: 100%; height: auto; image-rendering: pixelated; image-rendering: crisp-edges; }

  aside { display: flex; flex-direction: column; gap: 20px; min-width: 0; }
  section { background: var(--panel); border: 4px solid var(--edge); padding: 12px 14px; }
  h2 { margin: 0 0 10px; font: 10px/1.6 "Press Start 2P", monospace; color: var(--cyan); }

  .seq { list-style: none; margin: 0; padding: 0; }
  .seq li { display: grid; grid-template-columns: 34px 54px 1fr; gap: 0 8px; padding: 7px 0; border-bottom: 2px dashed var(--edge); }
  .seq li:last-child { border-bottom: 0; }
  .seq .pos { color: var(--dim); }
  .seq .pr { font: 10px/2 "Press Start 2P", monospace; }
  .seq .clr { font: 10px/2 "Press Start 2P", monospace; }
  .seq .why { grid-column: 3; color: var(--dim); }
  .c-cleared { color: var(--green); }
  .c-follow { color: var(--text); }
  .c-hold, .c-fix { color: var(--amber); }
  .c-go_around { color: var(--red); }
  .c-checking { color: var(--cyan); }
  .c-review { color: var(--amber); }
  .seq button.approve { grid-column: 3; justify-self: start; margin-top: 6px; font: 9px/1 "Press Start 2P", monospace; color: var(--green); background: transparent; border: 2px solid var(--green); cursor: pointer; padding: 5px 8px; white-space: nowrap; }
  .seq button.approve:hover { background: var(--green); color: var(--bg, #0f1530); }
  .seq button.approve:disabled { opacity: 0.5; cursor: default; }
  .landed { color: var(--dim); margin-top: 10px; }
  .landed b { color: var(--green); font-weight: normal; }
  .landed button { padding: 0 2px; font: inherit; color: var(--green); background: none; border: 0; border-bottom: 2px dotted var(--green); cursor: pointer; }
  canvas.pick { cursor: pointer; }

  .stats { display: grid; grid-template-columns: 1fr auto; gap: 2px 12px; margin: 0; }
  .stats dt { color: var(--dim); }
  .stats dd { margin: 0; text-align: right; }
  .stats .win { color: var(--green); }
  .flight pre { margin: 0; max-height: 300px; overflow: auto; white-space: pre-wrap; overflow-wrap: anywhere; font: 18px/1.15 "VT323", ui-monospace, monospace; }
  .flight .k { color: var(--cyan); }
  .flight .hint { color: var(--dim); margin: 8px 0 0; }
  .flight button { float: right; padding: 2px 6px; font: 8px "Press Start 2P", monospace; color: var(--dim); background: none; border: 2px solid var(--edge); cursor: pointer; }

  .log { list-style: none; margin: 0; padding: 0; }
  .log li { padding: 2px 0; }
  .log time { color: var(--dim); margin-right: 8px; }
  .log .bad { color: var(--red); }
  .log .good { color: var(--green); }
  .empty { color: var(--dim); }

  form.key { max-width: 460px; margin: 12vh auto; padding: 24px; background: var(--panel); border: 4px solid var(--edge); }
  form.key label { display: block; margin-bottom: 10px; font: 10px/1.6 "Press Start 2P", monospace; color: var(--amber); }
  form.key input { width: 100%; padding: 8px 10px; font: inherit; color: var(--text); background: var(--night); border: 2px solid var(--edge); }
  form.key button { margin-top: 12px; padding: 10px 14px; font: 10px "Press Start 2P", monospace; color: var(--night); background: var(--amber); border: 0; cursor: pointer; }
  :focus-visible { outline: 3px solid var(--amber); outline-offset: 2px; }

  .controls { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; padding: 10px 0 0; }
  .controls button { padding: 8px 10px; font: 10px "Press Start 2P", monospace; color: var(--text); background: var(--panel); border: 2px solid var(--edge); cursor: pointer; }
  .controls button[aria-pressed="true"] { color: var(--night); background: var(--amber); border-color: var(--amber); }
  .controls .clock { margin-left: auto; color: var(--dim); }
  .controls progress { flex: 1 1 160px; height: 10px; accent-color: var(--orange); }
  .replay-link { color: var(--cyan); }
  @media (max-width: 1100px) { main { grid-template-columns: 1fr; padding: 12px; } header { padding: 12px 16px; } }
</style>
</head>
<body>
<header>
  <h1>ATC</h1>
  <span class="sub">AIR TRAFFIC CONTROL</span>
  <span class="baseline" id="baseline"></span>
  <a class="replay-link" id="replayLink" hidden>Replay this run</a>
  <span class="live" id="live" hidden>LIVE</span>
</header>
<div id="app"></div>
<script>
(() => {
  // ── geometry (logical pixels) ──────────────────────────────────────────
  const W = 480, H = 240;
  const GROUND = 204;                                      // horizon / ground line
  const RUNWAY = { x: 392, w: 84, y: GROUND + 2 };         // short runway, right side
  const TOUCHDOWN = { x: RUNWAY.x + 6, y: GROUND };
  const SLOPE = { x: -0.92, y: -0.39 };                    // unit vector up the glide path
  const SLOTS = 7;                                         // approach slots before overflow → holding
  const HOLD = { x: 200, y0: 34, dy: 30, rx: 26 };         // holding stack, top centre (staggered)
  const GATE = { x: 352, y: GROUND + 12, dx: -32 };        // parked planes on the ground
  const LIVERY = ["#f38020", "#3fa2ff", "#ff5fb0", "#3ccf6e", "#ffd23f", "#a07bff", "#ff6b4a", "#2fd6c8"];
  const reduceMotion = matchMedia("(prefers-reduced-motion: reduce)").matches;

  const app = document.getElementById("app");
  const live = document.getElementById("live");
  const baselineEl = document.getElementById("baseline");
  const replaying = new URLSearchParams(location.search).has("replay"); // read-only: no review buttons
  const repo = decodeURIComponent((location.pathname.match(/^\/r\/([^/]+)/) || [])[1] || new URLSearchParams(location.search).get("repo") || "");
  let key = "";
  try { key = localStorage.getItem("agentmesh-key") || ""; } catch (_) {}
  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
  const pr = (fork) => { const m = /--pr(\d+)$/.exec(fork || ""); return m ? `PR${m[1]}` : (fork || "").split("--").slice(1).join("--").toUpperCase(); };
  const prNum = (fork) => Number((/--pr(\d+)$/.exec(fork || "") || [])[1] || 0);
  const hhmmss = (ms) => new Date(ms).toLocaleTimeString([], { hour12: false });

  function askForKey(message) {
    app.innerHTML = `<form class="key"><label for="k">${esc(message)}</label>
      <input id="k" type="password" autocomplete="off" placeholder="am_…"><button type="submit">CONTACT ATC</button></form>`;
    app.querySelector("form").addEventListener("submit", (e) => {
      e.preventDefault();
      key = app.querySelector("input").value.trim();
      try { localStorage.setItem("agentmesh-key", key); } catch (_) {}
      boot();
    });
    app.querySelector("input").focus();
  }
  function askForRepo() {
    app.innerHTML = `<form class="key"><label for="r">BASELINE REPO</label>
      <input id="r" placeholder="shop-…"><button type="submit">WATCH AIRSPACE</button></form>`;
    app.querySelector("form").addEventListener("submit", (e) => {
      e.preventDefault();
      location.href = "/r/" + encodeURIComponent(app.querySelector("input").value.trim());
    });
  }

  // ── scene state ────────────────────────────────────────────────────────
  let state = null;
  const planes = new Map();
  const clouds = [
    ...Array.from({ length: 5 }, (_, i) => ({ x: i * 101 % W, y: 18 + (i * 37) % 70, s: 2, v: 0.05, a: 0.95 })),
    ...Array.from({ length: 5 }, (_, i) => ({ x: (i * 89 + 40) % W, y: 90 + (i * 23) % 70, s: 1, v: 0.025, a: 0.7 })),
  ];

  /** Where each plane should be, from the ATC sequence. */
  function targets() {
    const out = new Map();
    const seq = state.sequence || [];
    const approach = seq.filter((e) => ["cleared", "follow", "checking", "review"].includes(e.clearance));
    const holding = seq.filter((e) => !["cleared", "follow", "checking", "review"].includes(e.clearance));
    approach.forEach((e, i) => {
      if (i >= SLOTS) { holding.push(e); return; }
      const d = 30 + i * 50;
      out.set(e.fork, { mode: "approach", x: TOUCHDOWN.x + SLOPE.x * d, y: TOUCHDOWN.y - 8 + SLOPE.y * d, entry: e });
    });
    holding.forEach((e, i) => out.set(e.fork, { mode: "holding", level: i, entry: e }));
    state.forks.filter((f) => f.status === "landed").sort((a, b) => a.landed_at - b.landed_at).slice(-4)
      .forEach((f, i) => out.set(f.name, { mode: "landed", x: GATE.x + i * GATE.dx, y: GATE.y }));
    return out;
  }

  function syncPlanes() {
    for (const f of state.forks) {
      if (f.status === "abandoned") { planes.delete(f.name); continue; }
      if (!planes.has(f.name)) planes.set(f.name, { x: -30, y: 40 + (prNum(f.name) * 29) % 90, face: 1, livery: LIVERY[(prNum(f.name) - 1 + LIVERY.length) % LIVERY.length], t: Math.random() * 6, phase: null });
    }
  }

  // ── event popups: real events float up from the plane they happened to ──
  const popups = [];
  let seenEvent = -1;
  const POP = {
    "fork.created": ["NEW PR", "#78d7ff"], "push.received": ["PUSH", "#ffffff"], "land.merged": ["LANDED", "#62e07c"],
    "signal.rebase_required": ["REBASE", "#ff5757"], "land.denied": ["DENIED", "#faae40"], "land.requested": ["REQ LAND", "#faae40"],
  };
  function addPopup(p) {
    const i = popups.findIndex((x) => x.fork === p.fork);
    if (i >= 0) popups.splice(i, 1); // one popup per plane: the latest real event wins
    popups.push(p);
  }
  function popEvents(events, initial) {
    const fresh = events.filter((e) => e.id > seenEvent).sort((a, b) => a.id - b.id);
    if (fresh.length) seenEvent = Math.max(seenEvent, ...fresh.map((e) => e.id));
    if (initial) return;
    for (const e of fresh) {
      if (e.kind === "check.pair" && e.detail && e.detail.status === "semantic_conflict") {
        for (const f of [e.detail.a, e.detail.b]) addPopup({ fork: f, text: "CONFLICT!", color: "#ff5757", born: performance.now() });
      } else if (POP[e.kind] && e.fork) {
        addPopup({ fork: e.fork, text: POP[e.kind][0], color: POP[e.kind][1], born: performance.now() });
      }
    }
  }
  function drawPopups(now) {
    for (let i = popups.length - 1; i >= 0; i--) {
      const p = popups[i], age = (now - p.born) / 2400;
      const plane = planes.get(p.fork);
      if (age > 1 || !plane) { popups.splice(i, 1); continue; }
      ctx.globalAlpha = 1 - age * age;
      ctx.font = "8px 'Press Start 2P'";
      const w = ctx.measureText(p.text).width;
      const y = plane.y - 24 - age * 18;
      px(plane.x - w / 2 - 2, y - 8, w + 4, 10, "rgba(15,21,48,0.9)");
      ctx.fillStyle = p.color; ctx.fillText(p.text, Math.round(plane.x - w / 2), Math.round(y));
      ctx.globalAlpha = 1;
    }
  }

  // ── drawing ────────────────────────────────────────────────────────────
  let canvas, ctx;
  const px = (x, y, w, h, c) => { ctx.fillStyle = c; ctx.fillRect(Math.round(x), Math.round(y), w, h); };

  function drawSky() {
    const bands = ["#2a63c0", "#3471cc", "#3f80d8", "#4b8fe2", "#5a9dea", "#6cabf0", "#80baf4", "#96c8f7", "#aed6fa", "#c6e3fc"];
    const bh = Math.ceil(GROUND / bands.length);
    bands.forEach((c, i) => {
      px(0, i * bh, W, bh, c);
      if (bands[i + 1]) for (let x = (i % 2) * 2; x < W; x += 4) px(x, (i + 1) * bh - 1, 2, 1, bands[i + 1]); // dither seam
    });
  }

  function drawCloud(x, y, s, a) {
    ctx.globalAlpha = a;
    px(x + 6 * s, y, 10 * s, 3 * s, "#ffffff");
    px(x + 2 * s, y + 3 * s, 20 * s, 4 * s, "#ffffff");
    px(x, y + 6 * s, 26 * s, 3 * s, "#ffffff");
    px(x + 2 * s, y + 9 * s, 22 * s, 1 * s, "#d5e4f6");
    ctx.globalAlpha = 1;
  }

  function drawClouds(dt) {
    for (const c of clouds) {
      if (!reduceMotion) c.x -= c.v * dt / 16;
      if (c.x < -28 * c.s) c.x = W + 6;
      drawCloud(c.x, c.y, c.s, c.a);
    }
    drawCloud(W - 92, 6, 3, 1); // hero cloud, top right: reserved for the Cloudflare logo
  }

  function drawGround(t) {
    px(0, GROUND - 6, W, 6, "#6a9a5a");                    // distant hills
    for (let x = 0; x < W; x += 24) px(x + 4, GROUND - 9, 14, 3, "#6a9a5a");
    px(0, GROUND, W, H - GROUND, "#3f7d36");
    for (let x = 0; x < W; x += 6) px(x, GROUND + 22, 3, 2, "#357030");
    // Terminal + tower.
    px(250, GROUND - 10, 70, 10, "#c7ccd8"); for (let x = 254; x < 316; x += 6) px(x, GROUND - 7, 3, 3, "#2b3a5c");
    px(328, GROUND - 26, 8, 26, "#c7ccd8"); px(325, GROUND - 32, 14, 7, "#78d7ff"); px(324, GROUND - 34, 16, 2, "#2b3a5c");
    // Apron + runway.
    px(200, GROUND + 6, RUNWAY.x - 196, 12, "#5a606c");
    px(RUNWAY.x, RUNWAY.y, RUNWAY.w, 8, "#4a4f5a");
    for (let i = 0; i < 3; i++) px(RUNWAY.x + 2, RUNWAY.y + 1 + i * 2, 6, 1, "#f4f4f4");
    for (let x = RUNWAY.x + 14; x < RUNWAY.x + RUNWAY.w - 4; x += 12) px(x, RUNWAY.y + 4, 6, 1, "#f4f4f4");
    // Approach lights stepping toward the threshold.
    const k = Math.floor(t / 110) % 6;
    for (let i = 0; i < 6; i++) px(RUNWAY.x - 6 - i * 7, GROUND + 3, 2, 2, i === 5 - k ? "#ffffff" : "#d8a72a");
  }

  /** 24×10 side-view airliner, facing right when face = 1. */
  function drawPlane(p, label, opts) {
    ctx.save();
    ctx.translate(Math.round(p.x), Math.round(p.y));
    if (p.face < 0) ctx.scale(-1, 1);
    const L = p.livery;
    px(-12, -5, 4, 5, L);                 // tail fin
    px(-12, -1, 22, 4, "#f4f6fb");        // fuselage
    px(10, 0, 2, 2, "#f4f6fb");           // nose
    px(-12, 2, 22, 1, L);                 // livery stripe
    for (let x = -7; x < 8; x += 2) px(x, 0, 1, 1, "#24304f"); // windows
    px(8, 0, 2, 1, "#24304f");            // cockpit
    px(-3, 3, 7, 2, "#9aa3b5");           // wing
    ctx.restore();

    if (opts.conflict && Math.floor(performance.now() / 300) % 2 === 0) {
      ctx.strokeStyle = "#ff5757"; ctx.lineWidth = 1;
      ctx.strokeRect(Math.round(p.x) - 15.5, Math.round(p.y) - 8.5, 31, 15);
    }
    ctx.font = "8px 'Press Start 2P'";
    const w = ctx.measureText(label).width;
    const bg = opts.tag === "cleared" ? "#1f7a3c" : opts.conflict ? "#8a1f1f" : "rgba(15,21,48,0.85)";
    px(p.x - w / 2 - 2, p.y - 18, w + 4, 10, bg);
    ctx.fillStyle = "#ffffff";
    ctx.fillText(label, Math.round(p.x - w / 2), Math.round(p.y - 10));
  }

  function conflictPairs() {
    const set = new Set();
    for (const s of state.signals || []) if (!s.resolved_at && (s.kind === "semantic_conflict" || s.kind === "merge_conflict") && s.about_fork) set.add([s.fork, s.about_fork].sort().join("|"));
    return [...set].map((x) => x.split("|"));
  }

  function step(dt) {
    const tg = targets();
    const ease = (p, x, y, k) => { p.x += (x - p.x) * k; p.y += (y - p.y) * k; };
    for (const [name, p] of planes) {
      const t = tg.get(name);
      if (!t) continue;
      p.t += dt / 1000;
      const k = reduceMotion ? 1 : Math.min(1, dt * 0.003);
      if (t.mode === "approach") { p.phase = null; p.face = 1; ease(p, t.x, t.y, k); }
      else if (t.mode === "holding") {
        p.phase = null;
        const cx = HOLD.x + (t.level % 2 ? 70 : 0), cy = HOLD.y0 + Math.floor(t.level / 2) * HOLD.dy + (t.level % 2 ? 14 : 0);
        const ox = reduceMotion ? 0 : Math.cos(p.t * 0.9) * HOLD.rx;
        p.face = reduceMotion ? 1 : (Math.sin(p.t * 0.9) > 0 ? -1 : 1);
        ease(p, cx + ox, cy + (reduceMotion ? 0 : Math.sin(p.t * 1.8)), Math.min(1, dt * 0.004));
      } else if (t.mode === "landed") {
        if (reduceMotion || p.phase === "parked") { p.phase = "parked"; p.x = t.x; p.y = t.y; p.face = -1; continue; }
        if (!p.phase) p.phase = "flare";
        if (p.phase === "flare") { p.face = 1; ease(p, TOUCHDOWN.x, RUNWAY.y - 3, Math.min(1, dt * 0.006)); if (Math.abs(p.x - TOUCHDOWN.x) < 2) p.phase = "rollout"; }
        else if (p.phase === "rollout") { p.face = 1; p.y = RUNWAY.y - 3; p.x += dt * 0.06; if (p.x > RUNWAY.x + RUNWAY.w - 14) p.phase = "taxi"; }
        else if (p.phase === "taxi") { p.face = -1; p.y += (t.y - p.y) * 0.1; p.x -= dt * 0.05; if (p.x <= t.x) p.phase = "parked"; }
      }
    }
  }

  let last = performance.now();
  function frame(now) {
    const dt = Math.min(64, now - last); last = now;
    if (state) {
      step(dt);
      drawSky();
      drawClouds(dt);                       // clouds stay behind the planes
      drawGround(now);
      ctx.fillStyle = "#ff5757";
      const pairs = conflictPairs();
      for (const [a, b] of pairs) {
        const pa = planes.get(a), pb = planes.get(b);
        if (!pa || !pb) continue;
        const n = Math.max(1, Math.floor(Math.hypot(pb.x - pa.x, pb.y - pa.y) / 3));
        for (let i = 0; i < n; i += 2) ctx.fillRect(Math.round(pa.x + (pb.x - pa.x) * i / n), Math.round(pa.y + (pb.y - pa.y) * i / n), 2, 2);
      }
      const inConflict = new Set(pairs.flat());
      const tags = new Map((state.sequence || []).map((e) => [e.fork, e.clearance]));
      for (const f of state.forks) {
        const p = planes.get(f.name);
        if (p) drawPlane(p, pr(f.name), { conflict: inConflict.has(f.name), tag: tags.get(f.name) });
      }
      drawPopups(now);
    }
    requestAnimationFrame(frame);
  }

  // ── ATC panel ──────────────────────────────────────────────────────────
  const WORD = { cleared: "CLEARED", follow: "FOLLOW", hold: "HOLD", go_around: "GO AROUND", checking: "STANDBY", fix: "HOLD", review: "REVIEW" };

  function logLine(e) {
    const d = e.detail || {};
    const who = pr(e.fork);
    switch (e.kind) {
      case "fork.created": return [`${who} opened`, ""];
      case "push.received": return [`${who} pushed ${(d.sha || "").slice(0, 7)}`, ""];
      case "check.pair": return d.status === "semantic_conflict" ? [`${pr(d.a)} x ${pr(d.b)}: conflict${d.symbol ? ` on ${d.symbol}` : ""}`, "bad"] : null;
      case "land.merged": return [`${who} landed`, "good"];
      case "land.denied": return [`${who} landing denied`, "bad"];
      case "signal.rebase_required": return [`${who} told to rebase`, "bad"];
      default: return null;
    }
  }

  function renderPanel() {
    baselineEl.innerHTML = `runway <b>${esc(state.baseline)}</b> at <b>${esc((state.baselineHead || "").slice(0, 7))}</b>`;
    const seq = state.sequence || [];
    const rows = seq.map((e) => `<li><span class="pos">#${e.position}</span><span class="pr">${esc(e.pr)}</span>
      <span class="clr c-${e.clearance}">${WORD[e.clearance] || e.clearance.toUpperCase()}</span><span class="why">${esc(e.reason)}</span>${
        e.clearance === "review" && key && !replaying ? `<button type="button" class="approve" data-approve="${esc(e.fork)}" data-sha="${esc((state.forks.find((f) => f.name === e.fork) || {}).head_sha || "")}" title="Approve this PR's latest push">APPROVE</button>` : ""}</li>`).join("");
    const landed = state.forks.filter((f) => f.status === "landed").sort((a, b) => a.landed_at - b.landed_at);
    const logged = new Set((state.flightLogs || []).map((l) => l.fork));
    const names = landed.map((f) => logged.has(f.name) ? `<button type="button" data-flight="${esc(f.name)}" title="Show flight log">${esc(pr(f.name))}</button>` : `<b>${esc(pr(f.name))}</b>`);
    document.getElementById("seq").innerHTML = (rows ? `<ul class="seq">${rows}</ul>` : `<p class="empty">No traffic. PRs appear when agents start work.</p>`)
      + (landed.length ? `<p class="landed">Landed: ${names.join(", ")}</p>` : "");
    document.querySelectorAll("[data-flight]").forEach((b) => (b.onclick = () => showFlight(b.dataset.flight)));
    // A person reviewing on the runway (issue #16): approve the PR's current head.
    document.querySelectorAll("[data-approve]").forEach((b) => (b.onclick = async () => {
      b.disabled = true;
      const res = await fetch(`/api/repos/${encodeURIComponent(repo)}/reviews`, {
        method: "POST", headers: { authorization: `Bearer ${key}`, "content-type": "application/json" },
        body: JSON.stringify({ fork: b.dataset.approve, sha: b.dataset.sha, verdict: "approve", reviewer: "a person on the dashboard" }), // the head shown
      });
      if (!res.ok) { // e.g. the PR moved since this was drawn: say why, then let the next refresh redraw it
        b.disabled = false;
        b.textContent = "REFUSED";
        b.title = ((await res.json().catch(() => ({}))).error) || `HTTP ${res.status}`;
      }
    }));
    renderSavings();
    renderFlight();
    const lines = state.events.map((e) => [e, logLine(e)]).filter(([, l]) => l).slice(0, 10)
      .map(([e, [t, cls]]) => `<li><time>${hhmmss(e.at)}</time><span class="${cls}">${esc(t)}</span></li>`).join("");
    document.getElementById("log").innerHTML = lines || `<li class="empty">Frequency quiet.</li>`;
  }

  // ── savings: what ATC saved, in numbers (issue #17) ────────────────────
  const secs = (ms) => `${Math.round(ms / 1000)} s`;
  function renderSavings() {
    const s = state.savings;
    const el = document.getElementById("savings");
    if (!s || !s.prs) { el.innerHTML = `<p class="empty">Numbers appear once PRs are checked.</p>`; return; }
    const avg = (xs) => xs.length ? xs.reduce((a, b) => a + b, 0) / xs.length : null;
    const wait = avg(s.waitMs);
    const rows = [
      ["PRs", `${s.prs} (${s.landed} landed)`],
      ["Pairs checked", `${s.pairsChecked}`],
      ["Conflicts found", `${s.conflicts}${s.signalMs.length ? ` in ${secs(Math.max(...s.signalMs))}` : ""}`],
      ["Typecheck cache hits", s.typechecks ? `${Math.round((s.cacheHits / s.typechecks) * 100)}% of ${s.typechecks}` : "-"],
      ["Rebases (ATC / naive)", `${s.rebases} / ${s.naiveRebases}`, s.naiveRebases > s.rebases],
      ["Avg wait to land", wait === null ? "-" : secs(wait)],
    ];
    el.innerHTML = `<dl class="stats">${rows.map(([k, v, win]) => `<dt>${k}</dt><dd${win ? ' class="win"' : ""}>${esc(v)}</dd>`).join("")}</dl>`;
  }

  // ── flight log: click a parked plane to read why it landed the way it did (issue #15) ──
  let flightFork = null, flightShown = null;
  function showFlight(fork) { flightFork = fork; renderFlight(); }
  function renderFlight() {
    const el = document.getElementById("flight");
    const log = flightFork && (state.flightLogs || []).find((l) => l.fork === flightFork);
    const key = log ? `${log.fork}|${log.note}|${log.noted}` : "";
    if (key === flightShown) return; // a log never changes once written: don't reset the reader's scroll on every push
    flightShown = key;
    if (!log) {
      el.innerHTML = `<h2>FLIGHT LOG</h2><p class="empty">Click a parked plane to read its flight log.</p>`;
      return;
    }
    const body = esc(log.note).replace(/^(ATC-[A-Za-z-]+:)/gm, '<span class="k">$1</span>');
    el.innerHTML = `<h2>FLIGHT LOG · ${esc(log.pr)} <button type="button" id="closeFlight">CLOSE</button></h2><pre>${body}</pre>
      <p class="hint">${log.noted ? `git note on ${esc(log.landedSha.slice(0, 7))}: git log --notes=atc` : "Writing the git note..."}</p>`;
    document.getElementById("closeFlight").onclick = () => showFlight(null);
  }
  function planeAt(ev) {
    const r = canvas.getBoundingClientRect();
    const x = (ev.clientX - r.left) * (W / r.width), y = (ev.clientY - r.top) * (H / r.height);
    const logged = new Set((state && state.flightLogs || []).map((l) => l.fork));
    const shown = state ? targets() : new Map(); // only planes at a gate: older landings are parked out of sight
    let best = null, bestD = 16;
    for (const [name, p] of planes) {
      if (!logged.has(name) || !shown.has(name)) continue;
      const d = Math.hypot(p.x - x, p.y - y);
      if (d < bestD) { best = name; bestD = d; }
    }
    return best;
  }

  // ── live: ATC pushes every change over a WebSocket (polling only as fallback) ──
  function applyState(next, initial) {
    state = next; syncPlanes(); popEvents(state.events || [], initial); renderPanel();
  }
  let timer = 0, socket = null, backoff = 1000, gotFirst = false;
  function setLive(ok, text) { live.hidden = false; live.classList.toggle("stale", !ok); live.textContent = text; }
  async function pollOnce() {
    const res = await fetch(`/api/repos/${encodeURIComponent(repo)}/state`, { headers: { authorization: `Bearer ${key}` } });
    if (res.status === 401) { key = ""; askForKey("KEY REJECTED. PASTE AGENTMESH_API_KEY."); return false; }
    const next = await res.json();
    if (!res.ok) throw new Error(next.error || res.statusText);
    applyState(next, !gotFirst); gotFirst = true;
    return true;
  }
  function connect() {
    const proto = location.protocol === "https:" ? "wss" : "ws";
    socket = new WebSocket(`${proto}://${location.host}/api/repos/${encodeURIComponent(repo)}/live?key=${encodeURIComponent(key)}`);
    socket.onopen = () => { backoff = 1000; clearTimeout(timer); setLive(true, "LIVE"); };
    socket.onmessage = (m) => { try { applyState(JSON.parse(m.data), !gotFirst); gotFirst = true; } catch (_) {} };
    socket.onclose = () => {
      setLive(false, "RECONNECTING");
      const fallback = async () => { try { await pollOnce(); } catch (_) {} timer = setTimeout(fallback, 3000); };
      fallback();
      setTimeout(() => { clearTimeout(timer); connect(); }, backoff);
      backoff = Math.min(backoff * 2, 15000);
    };
  }

  // ── replay: play a recorded run through the same animation ──────────────
  async function startReplay() {
    // Allow-listed recorded runs are public (issue #14): try without a key, ask for one only if refused.
    const res = await fetch(`/api/repos/${encodeURIComponent(repo)}/timeline`, key ? { headers: { authorization: `Bearer ${key}` } } : {});
    if (res.status === 401) { const msg = key ? "KEY REJECTED. PASTE AGENTMESH_API_KEY." : "ATC ACCESS KEY"; key = ""; return askForKey(msg); }
    if (!res.ok) { setLive(false, "REPLAY UNAVAILABLE"); return; }
    const tl = await res.json();
    if (!tl.snapshots.length) { setLive(false, "NOTHING RECORDED"); return; }
    const GAP = 2500; // compress idle stretches so the video keeps moving
    const snaps = tl.snapshots;
    const vt = [0];
    for (let i = 1; i < snaps.length; i++) vt.push(vt[i - 1] + Math.min(snaps[i].at - snaps[i - 1].at, GAP));
    const total = vt[vt.length - 1] + 1500;
    const realAt = (v) => {
      let i = 0; while (i + 1 < vt.length && vt[i + 1] <= v) i++;
      const next = snaps[i + 1] ? snaps[i + 1].at : Infinity;
      return { i, t: Math.min(snaps[i].at + (v - vt[i]), next - 1) };
    };
    let v = 0, speed = Number(new URLSearchParams(location.search).get("speed")) || 2, playing = true, lastI = -1, lastNow = performance.now();
    const ctl = document.getElementById("controls");
    ctl.hidden = false;
    ctl.innerHTML = `<button id="pp">PAUSE</button><button id="rs">RESTART</button>
      ${[1, 2, 4, 8].map((x) => `<button data-speed="${x}" aria-pressed="${x === speed}">${x}X</button>`).join("")}
      <progress id="pg" max="1000" value="0"></progress><span class="clock" id="clk"></span>`;
    const fmt = (ms) => `${String(Math.floor(ms / 60000)).padStart(2, "0")}:${String(Math.floor(ms / 1000) % 60).padStart(2, "0")}`;
    document.getElementById("pp").onclick = (e) => { playing = !playing; e.target.textContent = playing ? "PAUSE" : "PLAY"; };
    document.getElementById("rs").onclick = () => { v = 0; lastI = -1; seenEvent = -1; planes.clear(); popups.length = 0; playing = true; document.getElementById("pp").textContent = "PAUSE"; };
    ctl.querySelectorAll("[data-speed]").forEach((b) => (b.onclick = () => { speed = Number(b.dataset.speed); ctl.querySelectorAll("[data-speed]").forEach((x) => x.setAttribute("aria-pressed", String(x === b))); }));
    setLive(true, "REPLAY");
    const tick = () => {
      const now = performance.now();
      if (playing) v = Math.min(total, v + (now - lastNow) * speed);
      lastNow = now;
      const { i, t } = realAt(v);
      const events = tl.events.filter((e) => e.at <= t);
      if (i !== lastI || events.length !== (state && state.events ? state.events.length : -1)) {
        const first = lastI === -1;
        lastI = i;
        applyState({ ...snaps[i].state, flightLogs: (tl.flightLogs || []).filter((l) => l.landedAt <= t), events: events.slice().reverse() }, first);
      }
      document.getElementById("pg").value = Math.round((v / total) * 1000);
      document.getElementById("clk").textContent = `${fmt(v)} / ${fmt(total)}`;
      if (v >= total) { playing = false; document.getElementById("pp").textContent = "PLAY"; }
      requestAnimationFrame(tick);
    };
    requestAnimationFrame(tick);
  }

  async function boot() {
    if (!repo) return askForRepo();
    const replay = new URLSearchParams(location.search).has("replay");
    if (!key && !replay) return askForKey("ATC ACCESS KEY");
    app.innerHTML = `<main>
      <div><div class="scope"><canvas id="scene" width="${W}" height="${H}" aria-label="Side view of the approach: each pull request is a plane, nearest the runway lands next"></canvas></div>
      <div class="controls" id="controls" hidden></div></div>
      <aside>
        <section><h2>LANDING SEQUENCE</h2><div id="seq"></div></section>
        <section class="flight" id="flight"></section>
        <section><h2>SAVINGS</h2><div id="savings"></div></section>
        <section><h2>ATC LOG</h2><ul class="log" id="log"></ul></section>
      </aside>
    </main>`;
    canvas = document.getElementById("scene");
    ctx = canvas.getContext("2d");
    ctx.imageSmoothingEnabled = false;
    canvas.addEventListener("click", (ev) => { const f = planeAt(ev); if (f) showFlight(f); });
    canvas.addEventListener("mousemove", (ev) => canvas.classList.toggle("pick", !!planeAt(ev)));
    try { await document.fonts.load("8px 'Press Start 2P'"); } catch (_) {}
    const link = document.getElementById("replayLink");
    if (replay) {
      link.hidden = !key; link.textContent = "Back to live"; link.href = location.pathname;
      startReplay();
    } else {
      link.hidden = false; link.href = `${location.pathname}?replay`;
      try { await pollOnce(); } catch (_) {}
      connect();
    }
    requestAnimationFrame(frame);
  }
  boot();
})();
</script>
</body>
</html>
