<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reviews</title>
<style>
  :root {
    --bg: #ffffff; --panel: #f6f8fa; --text: #1f2328; --dim: #59636e; --line: #d1d9e0;
    --accent: #0969da; --good: #1a7f37; --bad: #cf222e; --warn: #9a6700; --add: #dafbe1; --del: #ffebe9;
    --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #0d1117; --panel: #151b23; --text: #e6edf3; --dim: #9198a1; --line: #3d444d; --accent: #4493f8; --good: #3fb950; --bad: #f85149; --warn: #d29922; --add: #12261e; --del: #2d1214; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
  header { display: flex; align-items: center; gap: 16px; padding: 12px 24px; border-bottom: 1px solid var(--line); background: var(--panel); }
  header a { color: var(--text); font-weight: 600; text-decoration: none; }
  header .me { margin-left: auto; color: var(--dim); }
  main { max-width: 1100px; margin: 0 auto; padding: 24px; }
  h1 { font-size: 22px; margin: 0 0 4px; }
  h2 { font-size: 16px; margin: 28px 0 8px; }
  a { color: var(--accent); }
  .dim { color: var(--dim); }
  .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .card { border: 1px solid var(--line); border-radius: 8px; padding: 12px 16px; margin: 8px 0; background: var(--bg); }
  .list .card { display: flex; gap: 12px; align-items: baseline; }
  button { font: inherit; padding: 5px 12px; border: 1px solid var(--line); border-radius: 6px; background: var(--panel); color: var(--text); cursor: pointer; }
  button.primary { background: var(--good); border-color: var(--good); color: #fff; }
  button.danger { color: var(--bad); }
  button:disabled { opacity: .5; cursor: default; }
  input, select, textarea { font: inherit; padding: 5px 8px; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); color: var(--text); }
  textarea { width: 100%; min-height: 54px; }
  label { display: block; margin: 6px 0 2px; color: var(--dim); }
  .pill { display: inline-block; padding: 1px 8px; border-radius: 999px; font-size: 12px; border: 1px solid var(--line); }
  .pill.good { color: var(--good); border-color: var(--good); }
  .pill.bad { color: var(--bad); border-color: var(--bad); }
  .pill.warn { color: var(--warn); border-color: var(--warn); }
  .verdict { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 8px; }
  .verdict .card { margin: 0; }
  .verdict .k { color: var(--dim); font-size: 12px; }
  .blockers li { color: var(--bad); }
  details { border: 1px solid var(--line); border-radius: 6px; margin: 4px 0; padding: 4px 10px; }
  pre { font-family: var(--mono); font-size: 12px; white-space: pre-wrap; word-break: break-word; margin: 6px 0; }
  .finding { border-left: 3px solid var(--line); }
  .finding.important { border-left-color: var(--bad); }
  .finding.nit { border-left-color: var(--dim); }
  .finding.pre-existing { border-left-color: var(--warn); }
  .diff { border: 1px solid var(--line); border-radius: 6px; margin: 10px 0; overflow: hidden; }
  .diff .file { padding: 6px 10px; background: var(--panel); border-bottom: 1px solid var(--line); font-family: var(--mono); font-size: 12px; }
  .diff table { border-collapse: collapse; width: 100%; font-family: var(--mono); font-size: 12px; }
  .diff td { padding: 0 8px; white-space: pre-wrap; word-break: break-all; vertical-align: top; }
  .diff td.n { color: var(--dim); text-align: right; width: 1%; user-select: none; }
  .diff tr.add td.c { background: var(--add); }
  .diff tr.del td.c { background: var(--del); }
  .diff tr.inline td { padding: 6px 10px; background: var(--panel); font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; white-space: normal; word-break: normal; }
  .err { color: var(--bad); }
  .tabs button.on { border-color: var(--accent); color: var(--accent); }
  @media (max-width: 640px) { main { padding: 16px; } header { padding: 10px 16px; } }
</style>
</head>
<body>
<header><a href="/">Reviews</a><span class="me" id="me"></span></header>
<main id="app">Loading…</main>
<script>
"use strict";
// Every element is built with textContent: nothing from the server is ever parsed as HTML.
const app = document.getElementById("app");
let token = "";
try { token = localStorage.getItem("atc-token") || ""; } catch (_) {}
let timer = null;

function h(tag, attrs, ...children) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v === undefined || v === null || v === false) continue;
    if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
    else if (k === "class") el.className = v;
    else el.setAttribute(k, v === true ? "" : String(v));
  }
  for (const c of children.flat(Infinity)) if (c !== null && c !== undefined && c !== false) el.append(c instanceof Node ? c : document.createTextNode(String(c)));
  return el;
}
const show = (...els) => { app.replaceChildren(...els.flat(Infinity).filter((e) => e !== null && e !== undefined && e !== false)); };
const short = (sha) => (sha || "").slice(0, 7);
const enc = encodeURIComponent;

async function api(method, path, body) {
  const headers = { "content-type": "application/json" };
  if (token) headers.authorization = `Bearer ${token}`;
  const res = await fetch(path, { method, headers, credentials: "same-origin", body: body === undefined ? undefined : JSON.stringify(body) });
  const data = await res.json().catch(() => ({}));
  if (res.status === 401) { signIn(); throw new Error("not signed in"); }
  if (!res.ok) { const e = new Error(data.error || `HTTP ${res.status}`); e.data = data; throw e; }
  return data;
}

function signIn() {
  clearInterval(timer);
  const input = h("input", { type: "password", placeholder: "atc_…", size: 48 });
  show(h("h1", {}, "Sign in"),
    h("p", { class: "dim" }, "Sign in through Cloudflare Access, or paste a personal API token (kept in this browser only)."),
    h("div", { class: "row" }, input, h("button", { class: "primary", onclick: () => { token = input.value.trim(); try { localStorage.setItem("atc-token", token); } catch (_) {} route(); } }, "Continue")));
}

function fail(err) { return h("p", { class: "err" }, err.message || String(err)); }
function link(href, text) { return h("a", { href, onclick: (e) => { e.preventDefault(); history.pushState(null, "", href); route(); } }, text); }

// ── home: repos and tokens ──
async function home() {
  const [{ repos }, { tokens }] = await Promise.all([api("GET", `/api/repos`), api("GET", `/api/tokens`)]);
  const name = h("input", { placeholder: "repo-name" });
  const msg = h("span", { class: "dim" });
  const label = h("input", { placeholder: "token label, e.g. laptop agent" });
  const made = h("div");
  show(
    h("h1", {}, "Repositories"),
    h("div", { class: "list" }, repos.length ? repos.map((r) => h("div", { class: "card" }, link(`/repos/${enc(r.name)}`, r.name), h("span", { class: "dim" }, `created by ${r.created_by}`))) : h("p", { class: "dim" }, "No repositories yet.")),
    h("div", { class: "row" }, name, h("button", { onclick: async () => { try { await api("POST", `/api/repos`, { name: name.value.trim() }); route(); } catch (e) { msg.textContent = e.message; } } }, "Create repository"), msg),
    h("h2", {}, "Personal API tokens"),
    h("p", { class: "dim" }, "For git pushes from scripts, the API, and coding agents over MCP (/mcp). An agent using your token acts as you."),
    h("div", { class: "list" }, tokens.map((t) => h("div", { class: "card" }, h("span", {}, t.label), h("span", { class: "dim" }, new Date(t.created_at).toLocaleString()), h("button", { class: "danger", onclick: async () => { await api("DELETE", `/api/tokens/${t.id}`); route(); } }, "Revoke")))),
    h("div", { class: "row" }, label, h("button", { onclick: async () => { const t = await api("POST", `/api/tokens`, { label: label.value.trim() || "token" }); made.replaceChildren(h("p", {}, "Copy it now; it won't be shown again:"), h("pre", {}, t.token)); } }, "Create token")),
    made,
  );
}

// ── repo: PRs ──
async function repoPage(repo, state) {
  const { prs } = await api("GET", `/api/repos/${enc(repo)}/prs?state=${state || ""}`);
  const tabs = ["", "draft", "ready", "merged", "closed"].map((s) => h("button", { class: s === (state || "") ? "on" : "", onclick: () => repoPage(repo, s).catch((e) => show(fail(e))) }, s || "all"));
  const creds = h("div");
  const title = h("input", { placeholder: "Title", size: 40 });
  const source = h("input", { placeholder: "branch with the work" });
  const target = h("input", { placeholder: "main" });
  const intent = Object.fromEntries(["what", "why", "testing", "risk", "revert"].map((k) => [k, h("textarea", { placeholder: k })]));
  const msg = h("span", { class: "err" });
  show(
    h("div", { class: "row" }, link("/", "Repositories"), h("span", { class: "dim" }, "/"), h("h1", {}, repo)),
    h("div", { class: "row tabs" }, tabs),
    h("div", { class: "list" }, prs.length ? prs.map((p) => h("div", { class: "card" }, h("span", { class: "pill" }, p.state), link(`/repos/${enc(repo)}/prs/${p.id}`, `PR${p.id} ${p.title}`), h("span", { class: "dim" }, `${p.source} → ${p.target} · ${p.author}`))) : h("p", { class: "dim" }, "No pull requests.")),
    h("h2", {}, "Push a branch"),
    h("button", { onclick: async () => { const c = await api("POST", `/api/repos/${enc(repo)}/git-credentials`); creds.replaceChildren(h("p", { class: "dim" }, `A push token for ${Math.round(c.expiresInSeconds / 3600)} hours:`), h("pre", {}, `${c.commands.clone}\n${c.commands.push}`)); } }, "Get git credentials"),
    creds,
    h("h2", {}, "Open a draft pull request"),
    h("p", { class: "dim" }, "Drafts run nothing. Mark it ready when you want CI and the review agents."),
    h("div", { class: "card" }, h("label", {}, "Title"), title, h("div", { class: "row" }, h("div", {}, h("label", {}, "From branch"), source), h("div", {}, h("label", {}, "Into"), target)),
      ...Object.entries(intent).map(([k, el]) => [h("label", {}, k === "revert" ? "How to revert" : k[0].toUpperCase() + k.slice(1)), el]),
      h("div", { class: "row" }, h("button", { class: "primary", onclick: async () => {
        try {
          const p = await api("POST", `/api/repos/${enc(repo)}/prs`, { title: title.value, source: source.value.trim(), target: target.value.trim() || undefined, intent: Object.fromEntries(Object.entries(intent).map(([k, el]) => [k, el.value])) });
          history.pushState(null, "", `/repos/${enc(repo)}/prs/${p.id}`); route();
        } catch (e) { msg.textContent = e.message; }
      } }, "Open draft PR"), msg)),
  );
}

// ── PR page ──
const tone = (v) => ({ pass: "good", clean: "good", clear: "good", fail: "bad", findings: "bad", blocking: "bad", incomplete: "warn", none: "warn", pending: "", skipped: "" })[v] || "";
const SEV = { important: 0, "pre-existing": 1, nit: 2 };

function verdictPanel(view) {
  const v = view.verdict;
  const cell = (k, val, cls) => h("div", { class: "card" }, h("div", { class: "k" }, k), h("span", { class: `pill ${cls || tone(val)}` }, val));
  return h("div", {},
    h("div", { class: "verdict" },
      cell("CI", v.ci === "none" ? "not configured" : v.ci, tone(v.ci)),
      cell("Review", v.review), cell("Security", v.security),
      cell("Risk", v.tier || "–", v.tier === "high" ? "bad" : v.tier === "medium" ? "warn" : "good"),
      cell("Approvals", `${v.approvals} of ${v.requiredApprovals}`, v.approvals >= v.requiredApprovals ? "good" : "warn"),
      cell("Merge", v.mergeable ? "ready" : "blocked", v.mergeable ? "good" : "bad")),
    v.needsHuman ? h("p", {}, h("strong", {}, "Needs a person: "), v.humanReasons.join("; ")) : null,
    v.blockers.length ? h("ul", { class: "blockers" }, v.blockers.map((b) => h("li", {}, b))) : null);
}

function findingCard(repo, view, f, refresh) {
  const kind = h("select", {}, ["wrong", "intentional", "wontfix"].map((k) => h("option", { value: k }, k === "wontfix" ? "won't fix" : k)));
  const reason = h("input", { placeholder: "why", size: 40 });
  const msg = h("span", { class: "err" });
  return h("div", { class: `card finding ${f.severity}` },
    h("div", { class: "row" }, h("span", { class: `pill ${f.severity === "important" ? "bad" : f.severity === "nit" ? "" : "warn"}` }, f.severity), h("strong", {}, f.title), h("span", { class: "dim" }, `${f.reviewer} · ${f.class} · ${f.file}:${f.line}`), f.status !== "open" ? h("span", { class: "pill good" }, f.status) : null),
    h("pre", {}, f.evidence),
    f.suggestion ? h("p", {}, h("span", { class: "dim" }, "Suggestion: "), f.suggestion) : null,
    f.resolution ? h("p", { class: "dim" }, `${f.resolution.by}: ${f.resolution.kind} — ${f.resolution.reason}`) : null,
    f.status === "open" && view.pr.state === "ready" ? h("div", { class: "row" }, kind, reason, h("button", { onclick: async () => {
      try { await api("POST", `/api/repos/${enc(repo)}/prs/${view.pr.id}/findings/${f.id}/resolve`, { kind: kind.value, reason: reason.value }); refresh(); } catch (e) { msg.textContent = e.message; }
    } }, "Resolve"), msg) : null);
}

/** A unified diff as tables per file, with findings shown under the line they point at. */
function diffView(text, findings, card) {
  const out = [];
  let file = null, table = null, newLine = 0, oldLine = 0;
  const byLine = new Map(findings.map((f) => [`${f.file}:${f.line}`, []]));
  for (const f of findings) byLine.get(`${f.file}:${f.line}`).push(f);
  const shown = new Set();
  for (const line of text.replace(/\n$/, "").split("\n")) {
    if (line.startsWith("diff --git")) {
      const m = / b\/(.+)$/.exec(line);
      file = m ? m[1] : line;
      table = h("table");
      out.push(h("div", { class: "diff" }, h("div", { class: "file" }, file), table));
      continue;
    }
    if (!table || line.startsWith("index ") || line.startsWith("--- ") || line.startsWith("+++ ") || line.startsWith("new file") || line.startsWith("deleted file")) continue;
    const hunk = /^@@ -(\d+)(?:,\d+)? \+(\d+)/.exec(line);
    if (hunk) { oldLine = +hunk[1]; newLine = +hunk[2]; table.append(h("tr", {}, h("td", { class: "n" }, ""), h("td", { class: "n" }, ""), h("td", { class: "c dim" }, line))); continue; }
    const kind = line[0] === "+" ? "add" : line[0] === "-" ? "del" : "ctx";
    table.append(h("tr", { class: kind }, h("td", { class: "n" }, kind === "add" ? "" : oldLine), h("td", { class: "n" }, kind === "del" ? "" : newLine), h("td", { class: "c" }, line)));
    if (kind !== "del") {
      const key = `${file}:${newLine}`;
      for (const f of byLine.get(key) || []) { shown.add(f.id); table.append(h("tr", { class: "inline" }, h("td", { colspan: 3 }, card(f)))); }
    }
    if (kind !== "add") oldLine++;
    if (kind !== "del") newLine++;
  }
  return { el: out, shown };
}

async function prPage(repo, id) {
  clearInterval(timer);
  const refresh = () => prPage(repo, id).catch((e) => show(fail(e)));
  const view = await api("GET", `/api/repos/${enc(repo)}/prs/${id}`);
  const pr = view.pr;
  const msg = h("span", { class: "err" });
  const act = (label, path, cls, body) => h("button", { class: cls, onclick: async () => {
    try { await api("POST", path, body); refresh(); } catch (e) { msg.textContent = e.data && e.data.blockers ? e.data.blockers.join("; ") : e.message; }
  } }, label);
  const findings = [...view.findings].sort((a, b) => (a.status === "open" ? 0 : 1) - (b.status === "open" ? 0 : 1) || SEV[a.severity] - SEV[b.severity]);
  const diffBox = h("div", { class: "dim" }, "Loading diff…");
  const card = (f) => findingCard(repo, view, f, refresh);
  show(
    h("div", { class: "row" }, link("/", "Repositories"), h("span", { class: "dim" }, "/"), link(`/repos/${enc(repo)}`, repo)),
    h("h1", {}, `PR${pr.id} ${pr.title}`),
    h("p", { class: "dim" }, h("span", { class: "pill" }, pr.state), ` ${pr.source} → ${pr.target} · ${pr.author} · head ${short(pr.head)}`),
    h("div", { class: "row" },
      pr.state === "draft" ? act("Ready for review", `/api/repos/${enc(repo)}/prs/${pr.id}/ready`, "primary") : null,
      pr.state === "ready" && !view.run ? act("Start review", `/api/repos/${enc(repo)}/prs/${pr.id}/ready`, "primary") : null,
      pr.state === "ready" ? act("Back to draft", `/api/repos/${enc(repo)}/prs/${pr.id}/draft`) : null,
      pr.state === "ready" ? h("button", { onclick: async () => { try { await api("POST", `/api/repos/${enc(repo)}/prs/${pr.id}/approve`, { sha: view.pr.head }); refresh(); } catch (e) { msg.textContent = e.message; } } }, `Approve ${short(pr.head)}`) : null,
      pr.state === "ready" ? h("button", { class: "primary", disabled: !view.verdict.mergeable, title: view.verdict.blockers.join("; "), onclick: async () => {
        try { await api("POST", `/api/repos/${enc(repo)}/prs/${pr.id}/merge`); refresh(); } catch (e) { msg.textContent = e.data && e.data.blockers ? e.data.blockers.join("; ") : e.message; }
      } }, "Merge") : null,
      ["draft", "ready"].includes(pr.state) ? act("Close", `/api/repos/${enc(repo)}/prs/${pr.id}/close`, "danger") : null,
      msg),
    h("h2", {}, "Intent"),
    h("div", { class: "card" }, ["what", "why", "testing", "risk", "revert"].map((k) => pr.intent[k] ? h("p", {}, h("span", { class: "dim" }, `${k === "revert" ? "How to revert" : k}: `), pr.intent[k]) : null)),
    h("h2", {}, "Verdict"),
    pr.state === "draft" ? h("p", { class: "dim" }, "Draft: nothing runs until it's marked ready.") : verdictPanel(view),
    view.checks.length ? [h("h2", {}, "Checks"), view.checks.map((c) => h("details", { open: c.status === "failed" || c.status === "errored" }, h("summary", {}, h("span", { class: `pill ${tone(c.status === "passed" ? "pass" : c.status === "failed" ? "fail" : c.status === "errored" ? "incomplete" : "")}` }, c.status), ` ${c.kind === "ci" ? "CI" : "agent"}: ${c.name}`, c.ms ? h("span", { class: "dim" }, ` · ${Math.round(c.ms / 1000)} s`) : null), c.log ? h("pre", {}, c.log) : null))] : null,
    h("h2", {}, `Findings (${findings.filter((f) => f.status === "open").length} open)`),
    findings.length ? h("div", { id: "findings" }, findings.map(card)) : h("p", { class: "dim" }, view.verdict.review === "pending" ? "Review in progress." : "No findings."),
    h("h2", {}, "Changes"),
    diffBox,
    h("h2", {}, "Activity"),
    h("div", {}, view.events.map((e) => h("div", { class: "dim" }, `${new Date(e.at).toLocaleString()} · ${e.kind.replace(".", " ")}${e.detail && e.detail.by ? ` by ${e.detail.by}` : ""}`))),
  );
  api("GET", `/api/repos/${enc(repo)}/prs/${pr.id}/diff`).then((d) => {
    const { el } = diffView(d.diff, view.findings.filter((f) => f.status === "open"), card);
    diffBox.replaceChildren(...(el.length ? el : [h("p", { class: "dim" }, "No changes.")]));
    diffBox.className = "";
  }).catch((e) => diffBox.replaceChildren(fail(e)));
  if (pr.state === "ready" && (view.verdict.review === "pending" || view.verdict.ci === "pending")) timer = setInterval(refresh, 5000);
}

async function route() {
  clearInterval(timer);
  try {
    const me = await api("GET", `/api/me`);
    document.getElementById("me").textContent = me.email;
    const parts = location.pathname.split("/").filter(Boolean).map(decodeURIComponent);
    if (parts[0] === "repos" && parts[2] === "prs" && parts[3]) await prPage(parts[1], Number(parts[3]));
    else if (parts[0] === "repos" && parts[1]) await repoPage(parts[1], "");
    else await home();
  } catch (e) {
    if (e.message !== "not signed in") show(fail(e));
  }
}
window.addEventListener("popstate", route);
route();
</script>
</body>
</html>
