name: Secret scan

# Scan every pull request for leaked credentials with TruffleHog (Docker image).
# Fails the check if a verified or unknown-status secret appears in any commit of the PR.
on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  trufflehog:
    runs-on: ubuntu-latest
    steps:
      - name: Check out PR history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Scan PR commits with TruffleHog
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          docker run --rm -v "$GITHUB_WORKSPACE:/repo:ro" \
            trufflesecurity/trufflehog:latest \
            git file:///repo \
            --since-commit "$BASE_SHA" \
            --branch "$HEAD_SHA" \
            --results=verified,unknown \
            --no-update \
            --fail
